# AURUM Markets — ui.kycland.xyz
#
# Upstream must match PORT in .env (default 8080).
# Install:
#   sudo cp nginx/ui.kycland.xyz.conf /etc/nginx/sites-available/ui.kycland.xyz
#   sudo ln -sf /etc/nginx/sites-available/ui.kycland.xyz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream aurum_markets {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ui.kycland.xyz;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        proxy_pass http://aurum_markets;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }
}
